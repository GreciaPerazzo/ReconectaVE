<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReconectaVE</title>
    <style>
        :root{
            --bg:#f5f7f9;
            --surface:#ffffff;
            --ink:#1f2933;
            --muted:#6b7280;
            --line:#e2e6ea;
            --accent:#15788f;
            --accent-dark:#0f5d70;
            --required:#c0392b;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            background:var(--bg);
            color:var(--ink);
            line-height:1.5;
        }
        .container{max-width:760px;margin:0 auto;padding:32px 20px}
        h1{font-size:2rem;margin:0 0 4px}
        h2{font-size:1.15rem;font-weight:500;color:var(--muted);margin:0 0 24px}

        #open-form-btn{
            background:var(--accent);color:#fff;border:none;
            padding:14px 22px;border-radius:10px;font-size:1rem;font-weight:600;
            cursor:pointer;
        }
        #open-form-btn:hover{background:var(--accent-dark)}

        #report-form{
            display:none;
            position:fixed;inset:0;
            background:rgba(15,23,32,.55);
            z-index:50;
            padding:20px;
            overflow-y:auto;
        }
        .modal-card{
            background:var(--surface);
            max-width:440px;margin:6vh auto;
            border-radius:16px;padding:28px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
            position:relative;
        }
        .modal-card h3{margin:0 0 4px;font-size:1.3rem}
        .modal-card .sub{color:var(--muted);font-size:.9rem;margin:0 0 22px}
        #close-form-btn{
            position:absolute;top:16px;right:16px;
            background:none;border:none;font-size:1.5rem;color:var(--muted);
            cursor:pointer;line-height:1;
        }

        .field{margin-bottom:16px}
        .field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
        .field label .req{color:var(--required)}
        .field input[type=text]{
            width:100%;padding:12px 14px;font-size:1rem;
            border:1px solid var(--line);border-radius:10px;
            background:#fff;color:var(--ink);
        }
        .field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}

        #dropzone{
            border:2px dashed #b8c2cc;border-radius:12px;
            padding:24px;text-align:center;cursor:pointer;
            color:var(--muted);transition:.15s;
        }
        #dropzone:hover,#dropzone.drag{border-color:var(--accent);background:#f0f7f9;color:var(--accent)}
        #dropzone .icon{display:block;margin-bottom:10px;line-height:0}
        #photo-preview{
            display:none;max-width:100%;max-height:200px;
            border-radius:10px;margin-top:12px;
        }
        #photo-name{display:block;margin-top:8px;font-size:.85rem;color:var(--muted)}

        #submit-btn{
            width:100%;background:var(--accent);color:#fff;border:none;
            padding:14px;border-radius:10px;font-size:1rem;font-weight:600;
            cursor:pointer;margin-top:8px;
        }
        #submit-btn:hover{background:var(--accent-dark)}
        #form-msg{text-align:center;margin:14px 0 0;font-weight:500}
    </style>
</head>
<body>
    <div class="container">
        <h1>ReconectaVE</h1>
        <h2>Reportar persona desaparecida</h2>

        <button id="open-form-btn">Reportar a persona desaparecida</button>

        <div id="report-form">
            <div class="modal-card">
                <button id="close-form-btn" aria-label="Cerrar">&times;</button>
                <h3>Reportar persona</h3>
                <p class="sub">Completa lo que sepas. Solo el nombre y tu contacto son obligatorios.</p>

                <div class="field">
                    <label for="name">Nombre completo <span class="req">*</span></label>
                    <input type="text" id="name" placeholder="Ej. María González" />
                </div>

                <div class="field">
                    <label for="cedula">Cédula (para facilitar la búsqueda)</label>
                    <input type="text" id="cedula" placeholder="Ej. V-12.345.678" />
                </div>

                <div class="field">
                    <label for="age">Edad <span class="req">*</span></label>
                    <input type="number" id="age" placeholder="Ej. 24" min="0" max="120" />
                </div>

                <div class="field">
                    <label for="location">Dónde se le vio por última vez</label>
                    <input type="text" id="location" placeholder="Ej. Altamira, Caracas" />
                </div>

                <div class="field">
                    <label for="contact">Tu contacto <span class="req">*</span></label>
                    <input type="text" id="contact" placeholder="Teléfono o email para avisarte" />
                </div>

                <div class="field">
                    <label>Foto (opcional)</label>
                    <div id="dropzone">
                        <span class="icon">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 16V4M12 4l-4 4M12 4l4 4"></path>
                                <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path>
                            </svg>
                        </span>
                        Arrastra una foto aquí o haz clic para elegir
                        <img id="photo-preview" alt="Vista previa" />
                        <span id="photo-name"></span>
                    </div>
                    <input id="photo" type="file" accept="image/*" style="display:none;" />
                </div>

                <button id="submit-btn">Reportar</button>
                <p id="form-msg"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js'

        document.getElementById('open-form-btn').addEventListener('click', () => {
            document.getElementById('report-form').style.display = 'block'
        })
        document.getElementById('close-form-btn').addEventListener('click', () => {
            document.getElementById('report-form').style.display = 'none'
        })

        const dropzone = document.getElementById('dropzone')
        const photoInput = document.getElementById('photo')

        dropzone.addEventListener('click', () => photoInput.click())
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault(); dropzone.classList.add('drag')
        })
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'))
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault(); dropzone.classList.remove('drag')
            if (e.dataTransfer.files.length) {
                photoInput.files = e.dataTransfer.files
                photoInput.dispatchEvent(new Event('change'))
            }
        })

        photoInput.addEventListener('change', (e) => {
            const f = e.target.files[0]
            const preview = document.getElementById('photo-preview')
            document.getElementById('photo-name').textContent = f ? f.name : ''
            if (f) {
                preview.src = URL.createObjectURL(f)
                preview.style.display = 'block'
            } else {
                preview.style.display = 'none'
            }
        })

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim()
            const cedula = document.getElementById('cedula').value.trim()
            const age = parseInt(document.getElementById('age').value)
            const location = document.getElementById('location').value.trim()
            const contact = document.getElementById('contact').value.trim()
            const msg = document.getElementById('form-msg')

            if (!name || !contact || !age) { msg.textContent = 'Nombre, contacto y edad son obligatorios.'; return }
            
            let photo_url = null
            const file = document.getElementById('photo').files[0]
            if (file) {
                const path = crypto.randomUUID() + '-' + file.name
                const { error: upErr } = await supabase.storage.from('photos').upload(path, file)
                if (upErr) { msg.textContent = 'Error subiendo foto: ' + upErr.message; return }
                photo_url = supabase.storage.from('photos').getPublicUrl(path).data.publicUrl
            }

            const { error } = await supabase.from('reports').insert({
                name, cedula, age, last_seen_location: location, contact, photo_url
            })

            if (error) { msg.textContent = 'Error: ' + error.message }
            else {
                msg.textContent = '✓ Reporte enviado.'
                document.getElementById('name').value = ''
                document.getElementById('cedula').value = ''
                document.getElementById('age').value = ''
                document.getElementById('location').value = ''
                document.getElementById('contact').value = ''
                photoInput.value = ''
                document.getElementById('photo-name').textContent = ''
                document.getElementById('photo-preview').style.display = 'none'
            }
        })
    </script>
</body>
</html>
